<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15191f">
<title>Analytics - AFK Bot</title>
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'}catch(e){}</script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="cube"></span><span>Analytics</span></div>
  <select id="acctSel" style="width:auto"></select>
  <span class="badge" id="statusBadge"><span class="dot"></span><span id="statusText">offline</span></span>
  <span class="badge hide-sm mono" id="uptimeBadge">-</span>
  <span style="flex:1"></span>
  <a class="btn sm" href="/">Dashboard</a>
  <button class="btn sm" id="themeBtn">Theme</button>
  <button class="btn sm" id="logoutBtn">Log out</button>
</header>
<main class="main" style="margin:0 auto"><div id="mount"></div></main>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/socket.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/js/charts.js"></script>
<script>
  Bot.initHeader();
  Charts.mount(document.getElementById('mount'));
  Charts.refresh();
  Bot.on('snapshot', () => Charts.refresh());
</script>
</body>
</html>
